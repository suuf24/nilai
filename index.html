  <style>
    * {
  box-sizing: border-box;
}

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(135deg, rgba(194,233,251,0.8), rgba(255,214,255,0.8), rgba(255,250,205,0.8));
  margin: 0;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

a {
  text-decoration: none;
}

h1 {
  color: #6c5ce7;
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  margin-bottom: 1.5rem;
  text-shadow: 1px 1px 0 white;
  text-align: center;
}

.search-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  width: 100%;
  max-width: 25rem;
  padding: 0 1rem;
}

input[type="text"] {
  padding: 0.8rem 1rem;
  width: 100%;
  border-radius: 1.5rem;
  border: none;
  font-size: clamp(1rem, 4vw, 1.2rem);
  text-align: center;
  box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.1);
  outline: none;
  background: rgba(255, 255, 255, 0.7);
  margin-bottom: 1rem;
}

input[type="text"]:focus {
  box-shadow: 0 0 0 2px #6c5ce7;
}

button {
  background: #6c5ce7;
  color: white;
  padding: 0.75rem 2rem;
  border: none;
  border-radius: 1.5rem;
  font-size: clamp(0.9rem, 3.5vw, 1rem);
  cursor: pointer;
  box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.1);
  transition: background 0.2s ease, transform 0.2s ease;
}

button:hover {
  background: #5a4ed4;
}

button:active {
  transform: scale(0.95);
}

.autocomplete-list {
  position: absolute;
  top: 3.5rem;
  width: 100%;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 1rem;
  box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.1);
  z-index: 10;
  max-height: 12rem;
  overflow-y: auto;
}

.autocomplete-item {
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-size: clamp(0.9rem, 3.5vw, 1rem);
  transition: background 0.2s ease;
}

.autocomplete-item:hover {
  background: #f0f0f0;
}

.container {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
  width: 100%;
  min-height: 5rem;
  padding: 0 1rem;
}

.student-card {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 1.25rem;
  padding: 1rem;
  box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.15);
  width: 100%;
  max-width: 18rem; /* Original size */
  aspect-ratio: 1/1; /* Maintain 1:1 aspect ratio */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 1rem; /* Proper spacing */
  position: relative;
  overflow: hidden;
  animation: slideIn 0.5s ease-out;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.student-card:hover {
  transform: translateY(-0.3rem);
  box-shadow: 0 0.7rem 2rem rgba(0,0,0,0.2);
}

.student-card::before {
  content: '🎓';
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  font-size: 2rem;
  opacity: 0.2;
}

.score {
  font-size: clamp(6.6rem, 24vw, 8.4rem); /* 3x larger */
  font-weight: bold;
  color: #ffffff;
  background: #6c5ce7; /* Default fallback */
  padding: 0.6rem 1.4rem;
  border-radius: 1.2rem;
  box-shadow: 0 0.3rem 0.8rem rgba(0,0,0,0.3);
  text-align: center;
  line-height: 1;
  animation: pulse 2s ease-in-out infinite; /* Existing pulse animation */
}

.score.gold {
  background: #FFD700; /* Gold for scores 85-100 */
  color: #333; /* Darker text for contrast */
  animation: pulse 2s ease-in-out infinite, goldGlow 2.5s ease-in-out infinite; /* Add glow animation */
}

.score.blue {
  background: #007BFF; /* Blue for scores 78-84 */
}

.score.red {
  background: #DC3545; /* Red for scores < 78 */
}

.name {
  font-size: clamp(0.8rem, 3vw, 0.9rem);
  color: #333;
  font-weight: 500;
  line-height: 1.4;
  text-align: center;
  max-width: 90%;
  word-wrap: break-word;
}

.loader {
  width: 50%;
  max-width: 15rem;
  height: 1.4rem;
  border-radius: 1rem;
  color: #6c5ce7;
  border: 2px solid;
  position: relative;
}

.loader::before {
  content: "";
  position: absolute;
  margin: 2px;
  inset: 0 100% 0 0;
  border-radius: inherit;
  background: currentColor;
  animation: l6 2s infinite;
}

@keyframes l6 {
  100% { inset: 0 }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(1rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}

@keyframes goldGlow {
  0%, 100% {
    box-shadow: 0 0.3rem 0.8rem rgba(0,0,0,0.3), 0 0 0.5rem rgba(255,215,0,0.4);
  }
  50% {
    box-shadow: 0 0.3rem 0.8rem rgba(0,0,0,0.3), 0 0 1.2rem rgba(255,215,0,0.8);
  }
}

footer {
  text-align: center;
  padding: 1.5rem 0;
  margin-top: 3rem;
}

footer p {
  margin-bottom: 0.6rem;
  font-size: clamp(0.9rem, 3.5vw, 1rem);
}

footer div {
  font-size: clamp(1.2rem, 4vw, 1.5rem);
}

footer a {
  margin: 0 0.8rem;
  transition: color 0.2s ease;
}

/* Media Queries for Additional Responsiveness */
@media (max-width: 600px) {
  body {
    padding: 0.5rem;
  }

  h1 {
    font-size: clamp(1.5rem, 6vw, 2rem);
  }

  .search-container {
    max-width: 100%;
  }

  input[type="text"] {
    padding: 0.7rem;
    font-size: clamp(0.9rem, 4.5vw, 1.1rem);
  }

  button {
    padding: 0.6rem 1.5rem;
    font-size: clamp(0.85rem, 4vw, 0.95rem);
  }

  .student-card {
    padding: 0.8rem;
    max-width: 15rem; /* Original mobile size */
  }

  .score {
    font-size: clamp(5.4rem, 21vw, 7.2rem); /* 3x larger for mobile */
    padding: 0.5rem 1.2rem;
    border-radius: 1rem;
    animation: pulse 2s ease-in-out infinite;
  }

  .score.gold {
    animation: pulse 2s ease-in-out infinite, goldGlow 2.5s ease-in-out infinite;
  }

  .name {
    font-size: clamp(0.7rem, 3.2vw, 0.85rem);
  }

  footer {
    padding: 1rem 0;
  }

  footer div {
    font-size: clamp(1rem, 4vw, 1.3rem);
  }
}

@media (min-width: 1200px) {
  h1 {
    font-size: clamp(2.2rem, 4vw, 3rem);
  }

  .search-container {
    max-width: 30rem;
  }

  input[type="text"] {
    font-size: clamp(1.1rem, 2vw, 1.3rem);
  }

  button {
    font-size: clamp(1rem, 1.5vw, 1.1rem);
  }

  .student-card {
    max-width: 20rem; /* Original desktop size */
  }

  .score {
    font-size: clamp(7.2rem, 15vw, 9rem); /* 3x larger for desktop */
    padding: 0.8rem 1.6rem;
    border-radius: 1.4rem;
    animation: pulse 2s ease-in-out infinite;
  }

  .score.gold {
    animation: pulse 2s ease-in-out infinite, goldGlow 2.5s ease-in-out infinite;
  }

  .name {
    font-size: clamp(0.85rem, 1.5vw, 1rem);
  }
}

    const searchInput = document.getElementById('search');
    const studentList = document.getElementById('student-list');
    const autocomplete = document.getElementById('autocomplete');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toUpperCase().trim();
      autocomplete.innerHTML = '';
      if (query.length < 2) return;

      const matches = students.filter(s => s.name.includes(query));
      matches.forEach(student => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = student.name;
        item.onclick = () => {
          searchInput.value = student.name;
          autocomplete.innerHTML = '';
        };
        autocomplete.appendChild(item);
      });
    });

    function handleCheck() {
  const query = searchInput.value.toUpperCase().trim();
  const student = students.find(s => s.name === query);
  studentList.innerHTML = '';

  const loading = document.createElement('div');
  loading.className = 'loader';
  studentList.appendChild(loading);

  setTimeout(() => {
    studentList.innerHTML = '';
    if (student) {
      let scoreClass = 'red'; // Default for scores < 78
      if (student.score >= 85) scoreClass = 'gold'; // Scores 85-100
      else if (student.score >= 78) scoreClass = 'blue'; // Scores 78-84

      studentList.innerHTML = `
        <div class="student-card">
          <span class="score ${scoreClass}">${student.score}</span>
          <span class="name">${student.name}</span>
        </div>
      `;
      searchInput.value = ""; // Clear the textbox
    } else {
      studentList.innerHTML = `<p style="text-align:center; color:#444;">Nama tidak ditemukan.</p>`;
      searchInput.value = ""; // Clear the textbox even if no student is found
    }
  }, 1500);
}
</script>
  
</body>
</html>
